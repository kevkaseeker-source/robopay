# Installed to /etc/systemd/journald.conf.d/ by car/logging/install.sh.
#
# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# (package raspberrypi-sys-mods) with Storage=volatile, so the journal lives
# in RAM only and every crash/power loss wipes it - just creating
# /var/log/journal is NOT enough, that drop-in still wins. This file sorts
# after it (90 > 40) and overrides it.
[Journal]
Storage=persistent
# Default is 5 min: a hard power loss (e.g. undervoltage under motor load)
# would lose exactly the minutes leading up to the crash. CRIT and above are
# always synced immediately regardless (power_monitor.sh relies on that).
SyncIntervalSec=10s
# Keep SD-card usage bounded.
SystemMaxUse=300M
SystemKeepFree=1G
